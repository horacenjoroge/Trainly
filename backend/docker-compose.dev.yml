version: '3.8'
services:
  api:
    build:
      context: .
      target: development
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./public:/app/public
      - uploads:/app/public/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    command: npx nodemon src/app.js

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  uploads:

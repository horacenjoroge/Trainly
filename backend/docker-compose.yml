version: '3.8'

services:
  api:
    build:
      context: .
      target: ${NODE_ENV:-development}
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    volumes:
      - ./src:/app/src:ro
      - ./models:/app/models:ro
      - ./public:/app/public
      - uploads:/app/public/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis (optional, enable by: docker compose --profile with-redis up)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles:
      - with-redis
    restart: unless-stopped

volumes:
  mongo_data:
  uploads:

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.google.dagger.hilt.android"
apply plugin: "kotlin-kapt"

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk 35
    namespace 'com.trainly.app'
    defaultConfig {
        applicationId 'com.trainly.app'
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 1
        versionName "1.0.0"
    }
    buildFeatures { compose true; buildConfig true }
    composeOptions { kotlinCompilerExtensionVersion = "1.5.15" }
    signingConfigs { debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    buildTypes {
        debug { signingConfig signingConfigs.debug; buildConfigField "String", "API_BASE_URL", "\"http://10.0.2.2:3000/\"" }
        release { signingConfig signingConfigs.debug; minifyEnabled true; proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"; buildConfigField "String", "API_BASE_URL", "\"https://trainingapp-api-production.up.railway.app/\"" }
    }
    kotlinOptions { jvmTarget = "17" }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packagingOptions { resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" } }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'; implementation 'androidx.compose.ui:ui-graphics'; implementation 'androidx.compose.ui:ui-tooling-preview'; implementation 'androidx.compose.material3:material3'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'com.google.dagger:hilt-android:2.53.1'; kapt 'com.google.dagger:hilt-android-compiler:2.53.1'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'; implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'; implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.room:room-runtime:2.6.1'; implementation 'androidx.room:room-ktx:2.6.1'; kapt 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.paging:paging-runtime-ktx:3.3.4'; implementation 'androidx.paging:paging-compose:3.3.4'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'; testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'; testImplementation 'io.mockk:mockk:1.13.13'; testImplementation 'app.cash.turbine:turbine:1.2.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
kapt { correctErrorTypes true }
